services:
  kong-database:
    image: postgres:13
    container_name: kong-database
    restart: always
    ports:
      - "${KONG_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${KONG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KONG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${KONG_POSTGRES_DB}
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  kong-migrations:
    image: kong:3.5
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_PG_HOST: ${KONG_POSTGRES_HOST}
      KONG_PG_USER: ${KONG_POSTGRES_USER}
      KONG_PG_PASSWORD: ${KONG_POSTGRES_PASSWORD}
      KONG_PG_DATABASE: ${KONG_POSTGRES_DB}
    command: kong migrations bootstrap
    networks:
      - app-network

  kong:
    image: kong:3.5
    container_name: kong
    restart: always
    depends_on:
      - kong-database
    volumes:
      - ../../logs:/logs
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_PG_HOST: ${KONG_POSTGRES_HOST}
      KONG_PG_USER: ${KONG_POSTGRES_USER}
      KONG_PG_PASSWORD: ${KONG_POSTGRES_PASSWORD}
      KONG_PG_DATABASE: ${KONG_POSTGRES_DB}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:${KONG_ADMIN_API_HTTP_PORT}, 0.0.0.0:${KONG_ADMIN_API_HTTPS_PORT}"
    ports:
      - "${KONG_PROXY_HTTP_PORT}:8000"
      - "${KONG_PROXY_HTTPS_PORT}:8443"
      - "${KONG_ADMIN_API_HTTP_PORT}:8001"
      - "${KONG_ADMIN_API_HTTPS_PORT}:8444"
    networks:
      - app-network

volumes:
  kong-db-data:

networks:
  app-network:
    external: true
