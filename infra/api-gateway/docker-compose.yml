services:
  kong-database:
    image: postgres:13
    container_name: kong-database
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  kong-migrations:
    image: kong:3.5
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    networks:
      - app-network

  kong:
    image: kong:3.5
    container_name: kong
    restart: always
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:${KONG_ADMIN_API_HTTP_PORT}, 0.0.0.0:${KONG_ADMIN_API_HTTPS_PORT}"
    ports:
      - "${KONG_PROXY_HTTP_PORT}:8000"
      - "${KONG_PROXY_HTTPS_PORT}:8443"
      - "${KONG_ADMIN_API_HTTP_PORT}:8001"
      - "${KONG_ADMIN_API_HTTPS_PORT}:8444"
    networks:
      - app-network

volumes:
  kong-db-data:

networks:
  app-network:
    external: true
