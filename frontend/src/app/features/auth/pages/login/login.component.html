<div class="login-page-split">
  <div class="login-page-left">
    <div>
      <img src="/assets/main/fks-logo.png" alt="FK Sarajevo Logo" class="login-logo" style="display:block;margin:0 auto 12px auto;max-width:70px;" />
      <img src="/assets/main/fks-styled.png" alt="FK Sarajevo" class="login-image" style="display:block;margin:0 auto 16px auto;max-width:180px;" />
    </div>
    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="title-wrapper">
        <h2 class="login-title" style="margin-top:10px;margin-bottom:8px;">Login</h2>
        <p class="login-subtitle" style="text-align:center;margin-bottom:18px;">
          Enter your email address to log in with your <br/> <b>Bordo Hub</b> account
        </p>
      </div>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput size='large' type="email" formControlName="email" placeholder="Enter your email" required />
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput type="password" formControlName="password" placeholder="Enter your password" required />
        <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
        <mat-error *ngIf="form.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
      </mat-form-field>
      <div *ngIf="error" class="login-error" style="color:red; margin-bottom:10px;">{{ error }}</div>
      <button mat-raised-button color="primary" type="submit" class="login-btn-large" [disabled]="loading || form.invalid">
        <mat-icon style="vertical-align:middle;margin-right:8px;">login</mat-icon>
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Logging in...</span>
      </button>
    </form>
    <div class="login-sponsors">
      <img src="/assets/sponsors/turkish-airlines.png" alt="Turkish Airlines logo" class="sponsor-logo" />
      <img src="/assets/sponsors/adidas.png" alt="Adidas logo" class="sponsor-logo" />
    </div>
  </div>
  <div class="login-page-right">
    <img src="/assets/login/fks-flag.jpg" alt="FK Sarajevo Flag" class="login-side-image" />
  </div>
</div>
